# Baut und veröffentlicht ein Release, sobald ein Tag "v*" gepusht wird
# (das macht `python tools/release.py release --channel …`).
#
# Je System entsteht ein ZIP-Bundle: Programmordner + Startskript + LIESMICH. Vor dem Hochladen prüft der
# Selbsttest das fertig gebaute Programm. Danach am eigenen Rechner:
#   python tools/release.py publish --wait --platform windows --platform macos
# (holt die Bundles, signiert das Release-Verzeichnis mit dem Update-Schlüssel und lädt alles hoch).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub-Release anlegen

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: python -m pip install -r requirements-dev.txt

      - name: Tag und Programmversion vergleichen
        shell: bash
        run: |
          v=$(python -c "import akustik; print(akustik.__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME passt nicht zu Version $v"; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Tests
        run: python -m pytest -q tests

      - name: Programm bauen
        run: python tools/release.py build --stage app --skip-tests

      - name: Selbsttest des gebauten Programms
        shell: bash
        run: |
          out="$RUNNER_TEMP/selbsttest.txt"
          AKUSTIKMESS_SELFTEST="$out" dist/AkustikMess/AkustikMess.exe || { cat "$out"; exit 1; }
          cat "$out"

      - name: ZIP-Bundle bauen
        run: python tools/release.py build --stage bundle --skip-tests

      - name: GitHub-Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release.py notes --version "$VERSION" > notes.md
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "release_build/AkustikMess-$VERSION-Windows.zip" --verify-tag \
            --title "AkustikMess $VERSION" --notes-file notes.md $pre

  macos:
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: python -m pip install -r requirements-dev.txt

      - name: Programm bauen
        run: python tools/release.py build --stage app --skip-tests

      - name: Selbsttest des gebauten Programms
        run: |
          out="$RUNNER_TEMP/selbsttest.txt"
          AKUSTIKMESS_SELFTEST="$out" dist/AkustikMess.app/Contents/MacOS/AkustikMess || { cat "$out"; exit 1; }
          cat "$out"

      - name: ZIP-Bundle bauen
        run: python tools/release.py build --stage bundle --skip-tests

      - name: An das GitHub-Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release_build/*-macOS.zip
